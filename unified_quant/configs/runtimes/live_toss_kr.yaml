name: live_toss_kr
market: KR
universe:
  source: index_events
  profiles:
    KR: [kospi200, kosdaq150]
  refresh: daily
  snapshot_dir: state/universes
  filters:
    enabled: false

data:
  timeframe: 1d
  period: 2y

capital:
  initial_cash: 10000000

costs:
  fee_rate: 0.00225
  slippage_rate: 0.0005

execution:
  order_type: market
  broker: toss
  live_confirm_required: true

risk:
  max_order_notional: 10000000
  max_daily_loss: 0
  max_daily_loss_pct: 0.03

live:
  holdings_file: state/live/kr/holdings.json
  loop_interval_seconds: 60
  signal_plan_file: state/live/kr/signal-plan.json
  order_ledger_file: state/live/kr/order-ledger.jsonl
  risk_state_file: state/live/kr/risk-state.json
  kill_switch_file: state/live/kr/KILL_SWITCH
  signal_bar_policy: completed_daily
  execution_window_minutes: 15
  history_window_bars: 300
  required_data_quality: valid
  allowed_degraded_warning_codes: []
